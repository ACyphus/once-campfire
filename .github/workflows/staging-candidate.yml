name: Publish private Campfire staging candidate

on:
  push:
    branches:
      - acyphus-campfire-v1-5-12-upgrade
    paths:
      - .github/workflows/staging-candidate.yml

permissions: {}

jobs:
  publish:
    if: github.repository == 'ACyphus/once-campfire' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REVISION: 35d13c690e6c40383c84fd987dc0a76abd9e78c0
      CANDIDATE_REF: ghcr.io/acyphus/once-campfire-staging:candidate-35d13c6-${{ github.run_id }}
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 35d13c690e6c40383c84fd987dc0a76abd9e78c0
          persist-credentials: false

      - name: Verify the build source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the staging candidate
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.CANDIDATE_REF }}
          build-args: |
            APP_VERSION=staging-1.5.12-35d13c6
            GIT_REVISION=${{ env.SOURCE_REVISION }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
          provenance: mode=min
          sbom: false

      - name: Record the immutable candidate reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s@%s\n' "${CANDIDATE_REF%:*}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
